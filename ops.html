<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adventure Lab · Ops · Aprobación del día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F4; --surface:#FFFFFF; --surface-2:#F7FAFA;
  --ink:#0E3A40; --ink-soft:#5C7479; --ink-faint:#8AA0A4;
  --line:#E2EAEA; --line-soft:#EDF2F2;
  --teal:#0FA37F; --teal-deep:#0B7A60; --teal-wash:#E6F6F0;
  --blue:#5E94B8; --amber:#D9881B; --amber-wash:#FCF1DE; --amber-line:#EBD3A6; --red:#E5484D; --red-wash:#FCE9E9;
  --shadow:0 1px 2px rgba(14,58,64,.04), 0 4px 16px rgba(14,58,64,.06);
  --r:14px;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* Sticky top */
.topwrap{position:sticky;top:0;z-index:40;box-shadow:0 6px 16px -10px rgba(14,58,64,.18)}
.appbar{background:var(--ink);color:#EAF3F2;padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
.appbar-in{max-width:760px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(15,163,127,.25)}
.brand small{font-weight:400;color:#9FBDBD;font-size:13px}
.role{font:600 11px/1 var(--mono);letter-spacing:1.5px;padding:6px 9px;border:1px solid rgba(255,255,255,.22);border-radius:7px;color:#CFE6E3}

/* Date nav */
.datenav{background:var(--bg);padding:11px 0}
.datenav-row{max-width:760px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:11px}
.arrow{width:40px;height:54px;border:1px solid var(--line);background:var(--surface);border-radius:11px;font-size:19px;color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .12s;flex:none}
.arrow:active{transform:scale(.94)}
.datebtn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 30px 9px 13px;box-shadow:var(--shadow);cursor:pointer;text-align:left;flex:none;min-width:114px}
.datebtn .d-day{font:700 20px/1 var(--sans);letter-spacing:-.4px}
.datebtn .d-name{font:500 11.5px/1 var(--sans);color:var(--ink-soft);margin-top:4px}
.datebtn .d-year{position:absolute;right:10px;bottom:8px;font:500 9px/1 var(--mono);letter-spacing:.5px;color:var(--ink-faint)}
.datebtn #datepicker{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;cursor:pointer;padding:0;pointer-events:none}
#refresh svg{transition:transform .5s}
#refresh.spin svg{animation:spin .6s linear}
.daytotals{margin-left:auto;display:flex;flex-direction:column;gap:5px;text-align:right;align-items:flex-end}
.daystat{font:600 10px/1 var(--mono);letter-spacing:.4px;color:var(--ink-soft)}
.dt{display:flex;align-items:baseline;justify-content:flex-end;gap:9px}
.dt .k{font:600 9.5px/1 var(--mono);letter-spacing:.8px;color:var(--ink-faint)}
.dt .v{font:600 15px/1 var(--mono);letter-spacing:-.3px;min-width:78px;text-align:right}
.dt.net .k{color:var(--teal-deep)}.dt.net .v{color:var(--teal-deep)}

/* OPS/COM strip */
.opscom{background:var(--surface);border-bottom:1px solid var(--line);padding:7px 0}
.opscom-in{max-width:760px;margin:0 auto;padding:0 16px;display:flex;gap:18px}
.oc{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.oc .lbl{font:600 10px/1 var(--mono);letter-spacing:1.4px;color:var(--ink-soft)}
.oc .bar{flex:1;height:5px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.oc .fill{height:100%;border-radius:99px;background:var(--teal);transition:width .35s cubic-bezier(.4,0,.2,1)}
.oc.com .fill{background:var(--blue)}
.oc .val{font:600 11px/1 var(--mono);color:var(--ink);flex:none}

/* Loading / Error */
.loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:15px}
.loading .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:60px 20px;color:var(--red)}
.error button{margin-top:14px;padding:10px 20px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font:600 14px/1 var(--sans);cursor:pointer}

/* Tour card */
.list{padding-top:5px;padding-bottom:64px}
.tour{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:11px;overflow:hidden;transition:border-color .15s}
.tour.open{border-color:#CFE0DF}
.tour-bar{height:4px;background:var(--line)}
.tour.ops-ok .tour-bar{background:var(--teal)}
.tour-body{padding:12px 13px}
.t-row1{display:flex;align-items:center;gap:9px;cursor:pointer}
.hour{font:600 12px/1 var(--mono);letter-spacing:.5px;background:var(--ink);color:#EAF3F2;padding:6px 8px;border-radius:7px;flex:none}
.avail-tag{font:500 10px/1 var(--mono);color:var(--ink-faint);flex:none}
.t-row1 .name{font-weight:600;font-size:15.5px;letter-spacing:-.1px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcorr-mark{display:none;flex:none;color:var(--amber)}
.tour.has-corr .tcorr-mark{display:inline-flex}
.lights{display:flex;gap:5px;flex:none}
.light{display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1 var(--mono);letter-spacing:.7px;padding:5px 7px;border-radius:7px;border:1px solid var(--line);color:var(--ink-faint);background:var(--surface-2)}
.light.on{background:var(--teal-wash);border-color:#BFE7D8;color:var(--teal-deep)}
.light .ck{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:7px}
.light.on .ck{background:var(--teal);border-color:var(--teal);color:#fff}
.chev{color:var(--ink-faint);transition:transform .22s;flex:none;margin-left:5px}
.tour.open .chev{transform:rotate(180deg)}
.t-meta{display:flex;flex-wrap:wrap;gap:5px 13px;margin-top:9px;color:var(--ink-soft);font-size:12.5px;cursor:pointer}
.t-meta .mi{display:inline-flex;align-items:center;gap:5px}
.t-meta .mi svg{opacity:.7;flex:none}
.t-meta .mi b{color:var(--ink);font-weight:600}
.crole-tag{display:inline-block;font:600 8px/1 var(--mono);letter-spacing:.4px;text-transform:uppercase;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);padding:2px 5px;border-radius:4px;vertical-align:1px;margin-right:1px}
.flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:99px;background:var(--amber-wash);color:#9A5E08}
.flag.red{background:var(--red-wash);color:#B42A2E}
.flag svg{flex:none}
/* Compact money strip — single slim line instead of 3 big boxes */
.tmoney{display:flex;align-items:baseline;gap:16px;margin-top:10px;padding:8px 12px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;flex-wrap:wrap}
.tm{display:flex;align-items:baseline;gap:6px}
.tm .k{font:600 8.5px/1 var(--mono);letter-spacing:1px;color:var(--ink-faint)}
.tm .v{font:600 14px/1 var(--mono);letter-spacing:-.2px}
.tm.net .k{color:var(--teal-deep)}.tm.net .v{color:var(--teal-deep)}
.tm.iva{margin-left:auto}
.tm.iva .k,.tm.iva .v{color:var(--ink-faint);font-weight:500;font-size:10px}

/* Colored meta icons — quick visual scan of pax / boat type */
.t-meta .ic{display:inline-flex;align-items:center}
.t-meta .ic svg{opacity:1}
.t-meta .ic.pax{color:var(--blue)}
.t-meta .ic.crew{color:#8B7BC4}
.t-crew{margin-top:5px}

/* Cancelled tour — grayed out and clearly marked */
.tour.cancelled{opacity:.6;filter:grayscale(.45)}
.tour.cancelled .tour-bar{background:var(--ink-faint)}
.tour.cancelled .hour{background:var(--ink-faint)}
.cancel-badge{font:600 9px/1 var(--mono);letter-spacing:1px;color:#B42A2E;background:var(--red-wash);border:1px solid #F3C9CB;padding:5px 7px;border-radius:7px;flex:none}
.tactions{display:flex;align-items:center;gap:8px;margin-top:12px}
.iconbtn{width:44px;height:44px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);text-decoration:none;transition:background .12s}
.iconbtn:active{background:var(--surface-2)}
.iconbtn.dashed{border-style:dashed}
.approve{appearance:none;border:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:13px;padding:11px 22px;border-radius:10px;background:var(--ink);color:#fff;letter-spacing:.1px;flex:0 0 auto;margin-left:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,background .15s}
.approve:active{transform:scale(.97)}
.approve.done{background:var(--teal-wash);color:var(--teal-deep);box-shadow:inset 0 0 0 1px #BFE7D8}
.approve.done:active{transform:none}
.approve:disabled{background:var(--line);color:var(--ink-faint);cursor:not-allowed}
.approve:disabled:active{transform:none}

/* Expand */
.detail{display:none;border-top:1px solid var(--line-soft);margin-top:13px;padding-top:4px}
.tour.open .detail{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.tour-note{margin-top:11px;font-size:12.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-soft);padding:8px 11px;border-radius:9px;display:flex;gap:8px}
.tour-note svg{flex:none;opacity:.6;margin-top:1px}
.resv-hdr{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
.resv-hdr .t{font:600 10.5px/1 var(--mono);letter-spacing:1.5px;color:var(--ink-soft)}
.resv-hdr .rule{flex:1;height:1px;background:var(--line-soft)}

/* Reservation */
.resv{border:1px solid var(--line-soft);border-radius:10px;margin-top:7px;background:var(--surface-2);overflow:hidden}
.resv-row{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;cursor:pointer}
.checkin{width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;border:1.6px solid var(--ink-faint);color:var(--ink-faint);font-size:12px;margin-top:1px}
.checkin.in{background:var(--teal);border-color:var(--teal);color:#fff}
.resv-main{flex:1;min-width:0}
.resv-nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resv-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resv-sub b{color:var(--ink-soft);font-weight:600}
.resv-right{flex:none;display:flex;align-items:center;gap:8px;margin-top:1px}
.resv-pax{font:600 11.5px/1 var(--mono);color:var(--ink-soft)}
.resv-net{font:600 13px/1 var(--mono);color:var(--ink)}
.paydot{width:9px;height:9px;border-radius:50%;flex:none}
.paydot.full{background:var(--teal)}.paydot.due{background:var(--amber)}
.resv.cancelled{background:var(--red-wash)}
.resv.cancelled .resv-nm{text-decoration:line-through;color:var(--ink-soft)}
.cancel-tag{display:inline-flex;align-items:center;font:600 10px/1 var(--mono);letter-spacing:.5px;text-transform:uppercase;color:#B42A2E;background:#FCE9E9;border:1px solid #F3C6C7;padding:3px 7px;border-radius:6px;margin-right:8px}
.resv-chev{color:var(--ink-faint);flex:none;transition:transform .2s}
.resv.open .resv-chev{transform:rotate(180deg)}
.resv-detail{display:none;padding:0 11px 12px 43px}
.resv.open .resv-detail{display:block}
.resv-id{font:500 11px/1.4 var(--mono);color:var(--ink-faint);letter-spacing:.3px;margin-bottom:9px}
.rmoney{display:flex;gap:6px;margin-bottom:9px}
.rm{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line-soft);border-radius:7px;padding:6px 4px}
.rm .k{font:600 8.5px/1 var(--mono);letter-spacing:.6px;color:var(--ink-faint)}
.rm .v{font:600 12.5px/1 var(--mono);margin-top:4px}
.pay{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;margin-bottom:2px}
.pay.full{background:var(--teal-wash);color:var(--teal-deep)}
.pay.due{background:var(--amber-wash);color:#9A5E08}
.rfh{margin-top:10px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;font:600 12px/1 var(--sans);border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:8px}

/* Tour correction */
.corr-section{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.corr-open{display:inline-flex;align-items:center;gap:7px;cursor:pointer;border:1px solid var(--amber-line);background:var(--amber-wash);color:#9A5E08;font:600 12.5px/1 var(--sans);padding:10px 13px;border-radius:9px;width:100%;justify-content:center}
.corr-form{display:none}
.corr-form.show{display:block}
.corr-desc{font-size:12px;color:var(--ink-soft);line-height:1.5;margin:0 0 9px;background:var(--surface-2);border:1px solid var(--line-soft);padding:9px 11px;border-radius:9px}
.corr-form textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:400 12.5px/1.4 var(--sans);resize:vertical;min-height:62px;background:var(--surface);color:var(--ink)}
.corr-form textarea:focus{outline:none;border-color:var(--amber)}
.photo-row{display:flex;gap:8px;margin-top:9px}
.photo-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:1px dashed var(--line);background:var(--surface);border-radius:9px;padding:11px;font:600 12px/1 var(--sans);color:var(--ink-soft)}
.photo-btn:active{background:var(--surface-2)}
.photo-btn input{display:none}
.corr-prevwrap{display:none;position:relative;margin-top:9px;width:max-content;max-width:100%}
.corr-prevwrap.show{display:block}
.corr-prev{max-width:100%;max-height:150px;border-radius:9px;border:1px solid var(--line);display:block}
.corr-rmphoto{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(14,58,64,.78);color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center}
.corr-actions{display:flex;gap:8px;margin-top:11px}
.corr-actions button{font:600 12.5px/1 var(--sans);padding:11px 16px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft)}
.corr-actions .save{background:var(--amber);border-color:var(--amber);color:#fff;flex:1}
.corr-saved{display:none;border:1px solid var(--amber-line);background:var(--amber-wash);border-radius:10px;padding:11px 12px}
.corr-saved.show{display:block}
.corr-saved-head{display:flex;align-items:center;gap:7px;font:600 9.5px/1 var(--mono);letter-spacing:1px;color:#9A5E08}
.corr-edit{margin-left:auto;border:1px solid var(--amber-line);background:var(--surface);color:#9A5E08;font:600 11px/1 var(--sans);padding:6px 11px;border-radius:7px;cursor:pointer}
.corr-saved-text{margin:9px 0 0;font-size:12.5px;color:#7A4B07;line-height:1.5;white-space:pre-wrap}
.corr-saved-photo{display:none;margin-top:10px;max-width:100%;max-height:160px;border-radius:9px;border:1px solid var(--amber-line)}

.nodata{text-align:center;padding:50px 20px;color:var(--ink-faint);font-size:15px}

:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="topwrap">
  <div class="appbar"><div class="appbar-in">
    <div class="brand"><span class="dot"></span> Adventure Lab <small>· Aprobación</small></div>
    <span class="role">OPS</span>
  </div></div>
  <div class="datenav"><div class="datenav-row">
    <button class="arrow" id="prev" aria-label="Día anterior">‹</button>
    <div class="datebtn" id="datebtn" role="button" tabindex="0">
      <div class="d-day" id="d-day">—</div>
      <div class="d-name" id="d-name">&nbsp;</div>
      <div class="d-year" id="d-year">&nbsp;</div>
      <input type="date" id="datepicker" aria-label="Elegir fecha">
    </div>
    <button class="arrow" id="next" aria-label="Día siguiente">›</button>
    <button class="arrow" id="refresh" aria-label="Actualizar" title="Actualizar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11A8.1 8.1 0 004.5 9M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0015.5 2M20 19v-4h-4"/></svg></button>
    <div class="daytotals">
      <div class="daystat" id="day-stat">&nbsp;</div>
      <div class="dt"><span class="k">BRUTO DÍA</span><span class="v" id="day-gross">—</span></div>
      <div class="dt net"><span class="k">NETO DÍA</span><span class="v" id="day-net">—</span></div>
    </div>
  </div></div>
  <div class="opscom"><div class="opscom-in">
    <div class="oc"><span class="lbl">OPS</span><span class="bar"><span class="fill" id="ops-fill"></span></span><span class="val" id="ops-val">—</span></div>
    <div class="oc com"><span class="lbl">COM</span><span class="bar"><span class="fill" id="com-fill"></span></span><span class="val" id="com-val">—</span></div>
  </div></div>
</div>

<div class="wrap"><div class="list" id="day"></div></div>

<script>
// ============================================================
// CONFIG — update this URL after deploying the ops_day endpoint
// ============================================================
const API = 'https://script.google.com/macros/s/AKfycbxnEEtwt_cysahiCnd1PQvXJdmaq19obsvs5EDJIm8DvJv9PjLFmCFwnXLhoT_qcB2yHA/exec';

// ── Access key ──
// Entered once per device, kept in localStorage, sent with every API
// call. Never hardcode the key here — this repo is public.
const KEY_STORE = 'al_access_key';
function getAccessKey(){
  let k = localStorage.getItem(KEY_STORE);
  while(!k){
    k = (prompt('Adventure Lab — clave de acceso / enter access key:')||'').trim();
    if(k) localStorage.setItem(KEY_STORE, k);
  }
  return k;
}
function apiUrl(query){
  return API + query + (query.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(getAccessKey());
}
function handleUnauthorized(json){
  if(json && json.status==='error' && json.message==='Unauthorized'){
    localStorage.removeItem(KEY_STORE);
    alert('Clave de acceso incorrecta — recarga la página e intenta de nuevo.');
    return true;
  }
  return false;
}

// ── State ──
let DAY = null;       // current day payload
let currentDate = ''; // YYYY-MM-DD

// ── Helpers ──
const $ = s => document.querySelector(s);
const money = n => '$' + n.toLocaleString('es-MX');
const pending = {};   // pending photo per tour while editing correction

function todayStr() {
  const d = new Date();
  // Cancun = UTC-5 year-round
  const off = d.getTimezoneOffset();
  const cancun = new Date(d.getTime() + (off + (-5 * 60)) * 60000);
  return cancun.toISOString().slice(0, 10);
}

function shiftDate(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// Compute the date header labels locally (no need to wait on the API for
// this — it's pure date math) so the header updates the instant the user
// navigates, instead of blanking out until the network response arrives.
const DAY_NAMES = ['Domingo','Lunes','Martes','Miercoles','Jueves','Viernes','Sabado'];
const MONTH_NAMES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function dateLabels(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return { d_day: d.getDate() + ' ' + MONTH_NAMES[d.getMonth()], d_name: DAY_NAMES[d.getDay()], d_year: String(d.getFullYear()) };
}
function setHeader(dateStr) {
  const l = dateLabels(dateStr);
  $('#d-day').textContent = l.d_day;
  $('#d-name').textContent = l.d_name;
  $('#d-year').textContent = l.d_year;
}

const ICON = {

  rec:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 14h18l-2 5H5z"/><path d="M6 14V7l6-3 6 3v7"/></svg>',
  crew:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="2.6"/><path d="M3.5 19c0-2.7 2.5-4.4 5.5-4.4s5.5 1.7 5.5 4.4"/><path d="M16 6.5a2.6 2.6 0 010 5M17 14.6c2.6.3 4.5 2 4.5 4.4"/></svg>',

  note:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11l4 4v14H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>',
  pencil:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  cam:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h3l1.5-2h9L18 8h3v11H3z"/><circle cx="12" cy="13" r="3.2"/></svg>',
  up:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 17v3h16v-3"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>',
  chevsm:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>'
};
const light = (on,l) => `<span class="light ${on?'on':''}"><span class="ck">${on?'✓':''}</span>${l}</span>`;

// ── API fetch ──
// Client-side cache of already-fetched days (in-memory, this tab only) so
// revisiting a date already seen in this session is instant -- no network
// round-trip at all. Adjacent days are silently prefetched in the
// background after every load so back/forward navigation usually hits
// this cache too.
const dayCache = new Map(); // dateStr -> payload
const inFlight = new Map(); // dateStr -> Promise (de-dupes concurrent fetches)

function fetchDay(dateStr, forceRefresh) {
  if (!forceRefresh && dayCache.has(dateStr)) return Promise.resolve(dayCache.get(dateStr));
  if (!forceRefresh && inFlight.has(dateStr)) return inFlight.get(dateStr);
  const url = apiUrl('?action=ops_day&date=' + dateStr + (forceRefresh ? '&refresh=1' : ''));
  const p = fetch(url)
    .then(resp => { if (!resp.ok) throw new Error('HTTP ' + resp.status); return resp.json(); })
    .then(data => { if (handleUnauthorized(data)) throw new Error('Unauthorized'); if (data.error) throw new Error(data.error); dayCache.set(dateStr, data); inFlight.delete(dateStr); return data; })
    .catch(err => { inFlight.delete(dateStr); throw err; });
  inFlight.set(dateStr, p);
  return p;
}

function prefetchAround(dateStr) {
  fetchDay(shiftDate(dateStr, -1)).catch(() => {});
  fetchDay(shiftDate(dateStr, 1)).catch(() => {});
}

async function loadDay(dateStr, forceRefresh) {
  currentDate = dateStr;
  setHeader(dateStr); // instant -- pure date math, doesn't wait on the network

  const cached = !forceRefresh && dayCache.get(dateStr);
  if (!cached) $('#day').innerHTML = '<div class="loading"><div class="spin"></div><br>Cargando tours…</div>';

  try {
    DAY = await fetchDay(dateStr, forceRefresh);
    if (currentDate !== dateStr) return; // user navigated again before this resolved
    render();
    prefetchAround(dateStr);
  } catch (err) {
    console.error(err);
    if (currentDate !== dateStr) return;
    $('#day').innerHTML = `<div class="error">Error cargando datos<br><small>${err.message}</small><button onclick="loadDay('${dateStr}')">Reintentar</button></div>`;
  }
}

// ── Render ──
function renderBooking(b, tid, i) {
  const pay = b.cancelled
    ? '<span class="cancel-tag">Cancelado / Reembolsado</span>'
    : (b.paid_full ? '<div class="pay full">✓ Pagado completo</div>' : `<div class="pay due">Falta ${money(b.missing)} MXN</div>`);
  const sub = (b.affiliate ? `<b>${b.affiliate}</b> · ` : '') + `Booked by ${b.booked_by}`;
  const fhLink = b.fh_url ? `<a class="rfh" href="${b.fh_url}" target="_blank" rel="noopener">${ICON.fh} FareHarbor</a>` : '';
  return `
  <div class="resv ${b.cancelled?'cancelled':''}" id="r-${tid}-${i}">
    <div class="resv-row" onclick="rtoggle('${tid}',${i})">
      <span class="checkin ${b.checked_in?'in':''}">${b.checked_in?'✓':''}</span>
      <div class="resv-main">
        <div class="resv-nm">${b.name}</div>
        <div class="resv-sub">${b.cancelled ? 'Cancelado / Reembolsado' : sub}</div>
      </div>
      <div class="resv-right">
        <span class="resv-pax">${b.pax}px</span>
        <span class="resv-net">${money(b.net)}</span>
        ${b.cancelled ? '' : `<span class="paydot ${b.paid_full?'full':'due'}"></span>`}
        <span class="resv-chev">${ICON.chevsm}</span>
      </div>
    </div>
    <div class="resv-detail">
      <div class="resv-id">RES #${b.booking_no}</div>
      <div class="rmoney">
        <div class="rm"><div class="k">BRUTO</div><div class="v">${money(b.gross)}</div></div>
        <div class="rm"><div class="k">COM.</div><div class="v">${money(b.commission)}</div></div>
        <div class="rm"><div class="k">NETO</div><div class="v">${money(b.net)}</div></div>
      </div>
      ${pay}<br>
      ${fhLink}
    </div>
  </div>`;
}

function boatColor(name, rec) {
  const s = ((name||'') + ' ' + (rec||'')).toLowerCase();
  if (/vela|sail|catamaran|monocasco|monohull|hobie|velero/.test(s)) return 'var(--teal)';
  if (/boat|ponton|pontón|lancha|motor|ramona|carmelita|funday/.test(s)) return 'var(--blue)';
  if (/kayak|paddle|sup|tabla/.test(s)) return 'var(--amber)';
  return 'var(--ink-faint)';
}

function renderTour(t) {
  const flags = t.flags.map(f => `<span class="flag ${f.sev==='red'?'red':''}">${ICON.flag}${f.t}</span>`).join('');
  const crew = t.crew.map(c => c.role ? `<span class="crole-tag">${c.role}</span> ${c.name}` : c.name).join(' · ');
  const resv = t.bookings.map((b,i) => renderBooking(b, t.id, i)).join('');
  const id = t.id;
  const cancelled = t.bookings.length > 0 && t.bookings.every(b => b.cancelled);
  const fhBtn = t.fh_url ? `<a class="iconbtn" title="FareHarbor" href="${t.fh_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${ICON.fh}</a>` : '';
  const ivaBit = t.iva > 0 ? `<div class="tm iva"><span class="k">IVA incl.</span><span class="v">${money(t.iva)}</span></div>` : '';
  return `
  <div class="tour ${t.ops_approved?'ops-ok':''} ${cancelled?'cancelled':''}" id="tour-${id}">
    <div class="tour-bar"></div>
    <div class="tour-body">
      <div class="t-row1" onclick="toggle('${id}')" role="button" tabindex="0"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle('${id}')}">
        <span class="hour">${t.hour}</span>
        <span class="name">${t.name}</span>
        <span class="avail-tag">#${t.availability_pk}</span>
        <span class="tcorr-mark" title="Corrección reportada">${ICON.pencil}</span>
        ${cancelled
          ? `<span class="cancel-badge">CANCELADO</span>`
          : `<span class="lights">${light(t.ops_approved,'OPS')}${light(t.com_approved,'COM')}</span>`}
        <span class="chev">${ICON.chev}</span>
      </div>
      <div class="t-meta" onclick="toggle('${id}')">
        <span class="mi"><span class="ic pax">${ICON.pax}</span><b>${t.pax}</b> pax</span>
        <span class="mi"><span class="ic" style="color:${boatColor(t.name,t.recurso)}">${ICON.rec}</span>${t.recurso}</span>
      </div>
      ${crew ? `<div class="t-meta t-crew" onclick="toggle('${id}')"><span class="mi"><span class="ic crew">${ICON.crew}</span>${crew}</span></div>` : ''}
      ${flags?`<div class="flags">${flags}</div>`:''}
      <div class="tmoney">
        <div class="tm"><span class="k">BRUTO</span><span class="v">${money(t.gross)}</span></div>
        <div class="tm"><span class="k">COM</span><span class="v">${money(t.commission)}</span></div>
        <div class="tm net"><span class="k">NETO</span><span class="v">${money(t.net)}</span></div>
        ${ivaBit}
      </div>
      <div class="tactions">
        <div class="iconbtn dashed" title="Gastos / Inventario" onclick="event.stopPropagation()">${ICON.gastos}</div>
        ${fhBtn}
        <button class="approve ${t.ops_approved?'done':''}" id="ap-${id}" onclick="approve('${id}')"${cancelled?' disabled':''}>${cancelled?'Cancelado':(t.ops_approved?'✓ Aprobado':'Aprobar')}</button>
      </div>
      <div class="detail">
        ${t.notes?`<div class="tour-note">${ICON.note}<span>${t.notes}</span></div>`:''}
        <div class="resv-hdr"><span class="t">RESERVACIONES · ${t.bookings.length}</span><span class="rule"></span></div>
        ${resv}
        <div class="corr-section">
          <button class="corr-open" id="corr-open-${id}" onclick="corrOpen('${id}')">${ICON.pencil} Reportar información incorrecta</button>
          <div class="corr-form" id="corr-form-${id}">
            <p class="corr-desc">Describe qué dato está mal y adjunta una captura de FareHarbor con la información correcta. Si el error también está en FareHarbor, corrígelo ahí mismo.</p>
            <textarea id="corr-ta-${id}" placeholder="¿Qué información es incorrecta?"></textarea>
            <div class="corr-prevwrap" id="corr-prevwrap-${id}"><img class="corr-prev" id="corr-prev-${id}"><button class="corr-rmphoto" onclick="corrRmPhoto('${id}')">✕</button></div>
            <div class="photo-row">
              <label class="photo-btn">${ICON.cam} Cámara<input type="file" accept="image/*" capture="environment" onchange="onPhoto(this,'${id}')"></label>
              <label class="photo-btn">${ICON.up} Subir imagen<input type="file" accept="image/*" onchange="onPhoto(this,'${id}')"></label>
            </div>
            <div class="corr-actions">
              <button class="save" onclick="corrSave('${id}')">Guardar</button>
              <button onclick="corrCancel('${id}')">Cancelar</button>
            </div>
          </div>
          <div class="corr-saved" id="corr-saved-${id}">
            <div class="corr-saved-head">${ICON.pencil} CORRECCIÓN REPORTADA<button class="corr-edit" onclick="corrEdit('${id}')">Editar</button></div>
            <p class="corr-saved-text" id="corr-saved-text-${id}"></p>
            <img class="corr-saved-photo" id="corr-saved-photo-${id}">
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function render() {
  if (!DAY || !DAY.tours) { $('#day').innerHTML = '<div class="nodata">Sin tours para este día</div>'; return; }
  const tours = DAY.tours; // already sorted by API
  $('#day').innerHTML = tours.length ? tours.map(renderTour).join('') : '<div class="nodata">Sin tours para este día</div>';
  $('#d-day').textContent = DAY.d_day;
  $('#d-name').textContent = DAY.d_name;
  $('#d-year').textContent = DAY.d_year;
  const pax = tours.reduce((s,t) => s + t.pax, 0);
  $('#day-stat').textContent = `${tours.length} tour${tours.length!==1?'s':''} · ${pax} pax`;
  $('#day-gross').textContent = money(tours.reduce((s,t) => s + t.gross, 0));
  $('#day-net').textContent   = money(tours.reduce((s,t) => s + t.net, 0));
  updateLedger();
}

function updateLedger() {
  if (!DAY || !DAY.tours.length) {
    $('#ops-val').textContent = '—'; $('#com-val').textContent = '—';
    $('#ops-fill').style.width = '0%'; $('#com-fill').style.width = '0%';
    return;
  }
  const n = DAY.tours.length;
  const ops = DAY.tours.filter(t => t.ops_approved).length;
  const com = DAY.tours.filter(t => t.com_approved).length;
  $('#ops-val').textContent = ops+'/'+n; $('#com-val').textContent = com+'/'+n;
  $('#ops-fill').style.width = (ops/n*100)+'%'; $('#com-fill').style.width = (com/n*100)+'%';
}

// ── Interactions ──
function toggle(id) { $('#tour-'+id).classList.toggle('open'); }
function rtoggle(tid,i) { event.stopPropagation(); $('#r-'+tid+'-'+i).classList.toggle('open'); }

function approve(id) {
  event.stopPropagation();
  const t = DAY.tours.find(x => x.id === id);
  t.ops_approved = !t.ops_approved;
  // TODO: POST approval to API when wired
  // fetch(API + '?action=ops_approve_tour&tour_id=...&date=' + currentDate, { method:'POST' });
  const card = $('#tour-'+id);
  card.classList.toggle('ops-ok', t.ops_approved);
  $('#ap-'+id).classList.toggle('done', t.ops_approved);
  $('#ap-'+id).innerHTML = t.ops_approved ? '✓ Aprobado' : 'Aprobar';
  card.querySelector('.lights').innerHTML = light(t.ops_approved,'OPS') + light(t.com_approved,'COM');
  updateLedger();
}

// ── Corrections ──
function showForm(id) { $('#corr-form-'+id).classList.add('show'); $('#corr-open-'+id).style.display='none'; $('#corr-saved-'+id).classList.remove('show'); }
function corrOpen(id) {
  const t = DAY.tours.find(x => x.id===id);
  $('#corr-ta-'+id).value = t.correction?.text || '';
  pending[id] = t.correction?.photo || null;
  renderPreview(id);
  showForm(id);
  $('#corr-ta-'+id).focus();
}
function corrEdit(id) { corrOpen(id); }
function onPhoto(input, id) {
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = e => { pending[id] = e.target.result; renderPreview(id); };
  rd.readAsDataURL(f);
}
function renderPreview(id) {
  const wrap = $('#corr-prevwrap-'+id), img = $('#corr-prev-'+id);
  if (pending[id]) { img.src = pending[id]; wrap.classList.add('show'); } else { img.removeAttribute('src'); wrap.classList.remove('show'); }
}
function corrRmPhoto(id) { pending[id] = null; renderPreview(id); }
function corrSave(id) {
  const text = $('#corr-ta-'+id).value.trim();
  if (!text && !pending[id]) return;
  const t = DAY.tours.find(x => x.id === id);
  t.correction = { text, photo: pending[id] || null, edited: !!t.correction };
  // TODO: POST correction to API when wired
  // fetch(API + '?action=ops_save_correction', { method:'POST', body: JSON.stringify({...}) });
  $('#corr-saved-text-'+id).textContent = text || '(sin descripción)';
  const ph = $('#corr-saved-photo-'+id);
  if (t.correction.photo) { ph.src = t.correction.photo; ph.style.display = 'block'; } else { ph.style.display = 'none'; }
  $('#corr-form-'+id).classList.remove('show');
  $('#corr-saved-'+id).classList.add('show');
  $('#corr-open-'+id).style.display = 'none';
  $('#tour-'+id).classList.add('has-corr');
}
function corrCancel(id) {
  const t = DAY.tours.find(x => x.id === id);
  $('#corr-form-'+id).classList.remove('show');
  if (t.correction) { $('#corr-saved-'+id).classList.add('show'); }
  else { $('#corr-open-'+id).style.display = 'flex'; }
}

// ── Date navigation ──
$('#prev').onclick = () => loadDay(shiftDate(currentDate, -1));
$('#next').onclick = () => loadDay(shiftDate(currentDate, 1));

// Native date picker: an invisible <input type="date"> sits on top of the
// date button. Tapping the button opens the OS/browser's own fast calendar
// picker (showPicker() where supported, falling back to a native click).
const datePicker = $('#datepicker');
function openDatePicker() {
  datePicker.value = currentDate;
  if (datePicker.showPicker) { try { datePicker.showPicker(); return; } catch (err) {} }
  datePicker.click();
}
$('#datebtn').addEventListener('click', openDatePicker);
$('#datebtn').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDatePicker(); }
});
datePicker.onchange = () => { if (datePicker.value) loadDay(datePicker.value); };

// Refresh: force-bypass the server cache so approvals/corrections/new
// bookings made in FareHarbor show up immediately instead of waiting
// out the short cache TTL.
$('#refresh').onclick = async () => {
  const btn = $('#refresh');
  btn.classList.add('spin');
  await loadDay(currentDate, true);
  setTimeout(() => btn.classList.remove('spin'), 600);
};

// ── Init: load today ──
loadDay(todayStr());
</script>
